# Publish daily deals feed — Swiggy Instamart
#
# Once a day at 03:00 UTC (08:30 IST): runs the scanner in --json mode
# (same scan, no Telegram, no bot state) and publishes deals.json to the
# `feed` branch, where the Telegram subscription bot reads it from
#   https://raw.githubusercontent.com/stymrj/Swiggy-Instamart-Deals/feed/deals.json
# The subscriber bot fetches at ~08:45 IST and sends the digest at 09:00 IST.
# Separate from telegram-bot.yml, so the alert loop is untouched.
# The `feed` branch is force-pushed daily; do not commit anything else to it.
#
# Note: the per-campaign floors in bot-v2/config.json (60-85%) still gate
# collection, so the feed will contain almost no 50-59% deals from Swiggy;
# that is the scanner's existing behaviour, not a --json limitation.

name: Publish daily deals feed

on:
  schedule:
    - cron: '0 3 * * *'   # 03:00 UTC = 08:30 IST
  workflow_dispatch:

permissions:
  contents: write   # needed to push the feed branch

concurrency:
  group: deals-feed
  cancel-in-progress: false

jobs:
  secrets:
    # Skip the run with a warning, instead of failing it, until the secrets
    # this bot needs are set (Settings -> Secrets and variables -> Actions).
    if: github.event_name == 'workflow_dispatch' || vars.BOT_ENABLED == 'true'
    runs-on: ubuntu-latest
    outputs:
      ok: ${{ steps.check.outputs.ok }}
    steps:
      - name: Check required secrets
        id: check
        shell: bash
        env:
          SWIGGY_COOKIE: ${{ secrets.SWIGGY_COOKIE }}
        run: |
          missing=""
          for k in SWIGGY_COOKIE; do [ -n "${!k}" ] || missing="$missing $k"; done
          if [ -n "$missing" ]; then
            echo "::warning title=Skipped - secrets not set::Add these repository secrets to enable this workflow:$missing (see README)."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi

  feed:
    needs: secrets
    if: needs.secrets.outputs.ok == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SWIGGY_COOKIE: ${{ secrets.SWIGGY_COOKIE }}
      SWIGGY_STORE_ID: ${{ vars.SWIGGY_STORE_ID }}
      SWIGGY_PRIMARY_STORE_ID: ${{ vars.SWIGGY_PRIMARY_STORE_ID }}
      SWIGGY_SECONDARY_STORE_ID: ${{ vars.SWIGGY_SECONDARY_STORE_ID }}
      SWIGGY_DEVICE_ID: ${{ vars.SWIGGY_DEVICE_ID }}
      SWIGGY_BUILD_VERSION: ${{ vars.SWIGGY_BUILD_VERSION }}
      MIN_DISCOUNT: ${{ vars.MIN_DISCOUNT }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Scan and emit feed JSON
        run: node bot-v2/src/bot.js --json | tail -n 1 > deals.json

      - name: Validate deals.json
        run: |
          node -e "const j=require('./deals.json'); if(!Array.isArray(j.deals)) throw new Error('no deals array'); if(typeof j.store!=='string'||typeof j.generatedAt!=='string') throw new Error('bad feed header'); console.log(j.store+': '+j.deals.length+' deals @ '+j.generatedAt)"

      - name: Publish to feed branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -B feed
          git add deals.json
          if git diff --cached --quiet; then
            echo "feed unchanged"
          else
            git commit -m "feed: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            git push origin feed --force
          fi
